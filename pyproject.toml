[build-system]
requires = ["setuptools", "wheel", "Cython>=0.29.33"]
build-backend = "setuptools.build_meta"

[project]
name = "pgpack_dumper"
version = "0.3.8.dev0"
description = "Library for read and write PGPack format between PostgreSQL and file."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "0xMihalich", email = "bayanmobile87@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "csvpack==0.2.0.dev0",
    "base_dumper==0.3.0.dev0",
    "pgpack==0.4.0.dev0",
    "psycopg-binary>=3.3.4",
    "psycopg>=3.3.4",
    "pglast>=7.13",
]

[project.urls]
Homepage = "https://github.com/dns-technologies/pgpack_dumper"
Documentation = "https://dns-technologies.github.io/dbhose_airflow/classes/pgpack_dumper/index.html"
Repository = "https://github.com/dns-technologies/pgpack_dumper"
Changelog = "https://github.com/dns-technologies/pgpack_dumper/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = {find = {where = ["src"]}}
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pgpack_dumper = [ "**/*.pyd", "**/*.pyi", "**/*.sql", "*.pyd", "*.pyi", "*.md", "*.txt", "*.sql"]
